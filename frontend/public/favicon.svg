<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Tile Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Research Paper Sheet Icon -->
  <path d="M18 15C18 13.8954 18.8954 13 20 13H36L46 23V49C46 50.1046 45.1046 51 44 51H20C18.8954 51 18 50.1046 18 49V15Z" 
        fill="#1e293b" stroke="url(#primaryGrad)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Folded Corner on Paper -->
  <path d="M35 13V22C35 22.5523 35.4477 23 36 23H45" 
        stroke="url(#primaryGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="#334155" />

  <!-- Document Text Lines -->
  <line x1="25" y1="28" x2="33" y2="28" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <line x1="25" y1="34" x2="38" y2="34" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <line x1="25" y1="40" x2="32" y2="40" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

  <!-- Glowing AI Sparkle Star -->
  <g filter="url(#glow)">
    <path d="M43 33C43 37.4 39.4 41 35 41C39.4 41 43 44.6 43 49C43 44.6 46.6 41 51 41C46.6 41 43 37.4 43 33Z" 
          fill="url(#sparkleGrad)" />
    <!-- Center highlight -->
    <circle cx="43" cy="41" r="1.5" fill="#ffffff" />
  </g>
</svg>
